<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quokka-hud</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 논리 85x85 의 배율배. 실제 창에서는 이 요소가 창 전체를 채운다. -->
    <main class="hud" data-tauri-drag-region>
      <!-- 캔버스가 창 전체를 쓰므로 타이틀바는 그 위에 얹는다. -->
      <div class="titlebar" data-tauri-drag-region>
        <!--
          배율 버튼. 누를 때마다 1x -> 2x -> 3x -> 1x 로 돈다.
          라벨은 src/titlebar/scaleButton.ts 가 채운다.

          버튼에는 data-tauri-drag-region 을 걸지 않는다. 걸면 누르는 순간
          창 드래그로 잡혀 클릭이 먹지 않는다.
        -->
        <button
          type="button"
          class="hud-button titlebar__button titlebar__button--scale"
          data-titlebar-action="cycle-scale"
          aria-label="창 배율 바꾸기"
        >
          &#8203;
        </button>

        <div class="titlebar__group" data-tauri-drag-region>
          <button
            type="button"
            class="hud-button titlebar__button"
            data-window-action="minimize"
            aria-label="최소화"
          >
            &#8722;
          </button>
          <button
            type="button"
            class="hud-button titlebar__button titlebar__button--close"
            data-window-action="close"
            aria-label="닫기"
          >
            &#215;
          </button>
        </div>
      </div>

      <!-- 85x85 캔버스가 main.ts 에서 여기 붙는다. -->
      <div class="hud__stage" data-tauri-drag-region></div>

      <!--
        캔버스 위에 겹치는 사용량 표시. 값은 src/overlay/readoutOverlay.ts 가 채운다.
        pointer-events 를 꺼둬서(styles.css) 드래그 영역을 가리지 않는다.
      -->
      <div class="readout" data-readout-root>
        <div class="readout__line readout__line--usage">
          <span class="readout__label">Usage</span>
          <span class="readout__value" data-readout="usage">—</span>
          <span class="readout__stale" data-readout="stale" title="직전 값" hidden></span>
        </div>
        <div class="readout__line readout__line--sync">
          <span class="readout__label">Sync time</span>
          <span class="readout__value" data-readout="sync">—</span>
        </div>
      </div>

      <!--
        폴링 주기 버튼. 오른쪽 아래, 연못 밑 빈 땅에 둔다.
        라벨은 src/overlay/pollingButton.ts 가 채운다.

        data-tauri-drag-region 을 걸지 않는다. 걸면 누르는 순간 창 드래그로
        잡혀 클릭이 먹지 않는다. 감싸는 요소에도 걸지 않는다.
      -->
      <button
        type="button"
        class="hud-button polling"
        data-polling-action="cycle-interval"
        aria-label="사용량 갱신 주기 바꾸기"
      >
        <span class="polling__label">Polling</span>
        <span class="polling__value" data-polling="value">—</span>
      </button>

      <!--
        조회가 한 번도 성공하지 못했을 때만 뜨는 안내.
        문구는 src/overlay/guidance.ts 가 채운다.

        가림막 자체는 pointer-events 를 꺼둔다(styles.css). 안내가 창을 덮어도
        그 위를 끌면 창이 따라와야 한다. 재시도 버튼만 클릭을 받는다.
      -->
      <div class="guidance" data-guidance-root hidden>
        <p class="guidance__short" data-guidance="short">—</p>
        <p class="guidance__headline" data-guidance="headline">—</p>
        <p class="guidance__detail" data-guidance="detail"></p>
        <button
          type="button"
          class="hud-button guidance__retry"
          data-guidance="retry"
        >
          다시 시도
        </button>
        <p class="guidance__log" data-guidance="log" hidden></p>
      </div>
    </main>
  </body>
</html>
