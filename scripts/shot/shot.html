<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>quokka-hud 스크린샷</title>
    <!--
      README 용 스크린샷을 코드로 렌더하는 페이지. 앱의 일부가 아니다.

      화면을 캡처하는 대신 실제 렌더 코드와 실제 CSS 로 한 프레임을 그린다.
      마크업도 index.html 을 그대로 가져다 쓰므로, 창에서 보이는 것과
      같은 것이 나온다. 창을 띄우고 찍으면 그때그때 마우스 위치나
      애니메이션 위상이 섞여 들어간다.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /*
       * .hud 를 좌상단에 붙인다. styles.css 의 body 는 가운데 정렬이라
       * 그대로 두면 창 한가운데로 밀려나고, 헤드리스 창이 요청한 크기보다
       * 커서 스크린샷 좌상단 255x255 안에 안 들어온다.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      body {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./shot.ts"></script>
  </body>
</html>
